services:
  legal-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    # Coolify's proxy routes to this internal port; no host port is published.
    expose:
      - "3000"
    environment:
      SERVICE_URL_LEGAL_MCP_3000: /
      PUBLIC_URL: ${SERVICE_URL_LEGAL_MCP_3000}
      MCP_AUTH_TOKEN: ${SERVICE_PASSWORD_64_LEGALMCP}
      AUTO_AUTH_TOKEN: "true"
      ALLOW_PUBLIC_READ: ${ALLOW_PUBLIC_READ:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      REPO_URL: ${REPO_URL:-https://github.com/Klotzkette/claude-fuer-deutsches-recht.git}
      REPO_BRANCH: ${REPO_BRANCH:-}
      SOURCE_BASE_URL: ${SOURCE_BASE_URL:-https://github.com/Klotzkette/claude-fuer-deutsches-recht}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-900}
      SPARSE_CHECKOUT: ${SPARSE_CHECKOUT:-true}
      GIT_TIMEOUT_SECONDS: ${GIT_TIMEOUT_SECONDS:-300}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-2000000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - legal-index:/app/data
      - legal-source:/app/content
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  legal-index:
  legal-source:
